<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat</title>
    <style>
        /* ============================================================ */
        /* DEFAULT THEME — 用户导入CSS后会覆盖这里的变量和样式           */
        /* ============================================================ */
        :root {
          --chat-bg: #f0f0f0;
          --chat-bg-image: none;
          --chat-bg-blur: 0px;
          --chat-bg-overlay: transparent;

          --header-bg: rgba(255,255,255,0.85);
          --header-blur: 12px;
          --header-border: rgba(0,0,0,0.08);
          --header-title-color: #111111;
          --header-title-size: 17px;
          --header-title-weight: 600;
          --header-icon-color: #111111;

          --input-area-bg: rgba(255,255,255,0.9);
          --input-area-blur: 12px;
          --input-area-border: rgba(0,0,0,0.08);
          --input-box-bg: #f5f5f5;
          --input-box-color: #111111;
          --input-box-border: 1px solid rgba(0,0,0,0.08);
          --input-box-radius: 20px;
          --input-box-placeholder: #aaaaaa;
          --input-placeholder-text: "消息...";
          --send-btn-bg: #07C160;
          --send-btn-color: #ffffff;
          --icon-color: #888888;

          --bubble-them-bg: #ffffff;
          --bubble-them-color: #111111;
          --bubble-them-border: none;
          --bubble-them-radius: 4px 18px 18px 18px;
          --bubble-them-shadow: 0 1px 4px rgba(0,0,0,0.08);
          --bubble-me-bg: #07C160;
          --bubble-me-color: #ffffff;
          --bubble-me-border: none;
          --bubble-me-radius: 18px 4px 18px 18px;
          --bubble-me-shadow: 0 1px 4px rgba(0,0,0,0.08);
          --bubble-font-size: 15px;
          --bubble-line-height: 1.4;

          --timestamp-color: rgba(100,100,100,0.6);
          --date-divider-bg: rgba(0,0,0,0.08);
          --date-divider-color: rgba(80,80,80,0.7);

          --avatar-size: 36px;
          --avatar-radius: 50%;

          --music-card-bg: rgba(255,255,255,0.95);
          --music-card-color: #111111;
          --music-card-radius: 12px;

          --voice-bg: inherit;
          --voice-color: inherit;

          --recalled-color: #aaaaaa;
          --system-msg-color: #aaaaaa;
          --system-msg-bg: rgba(0,0,0,0.05);

          --safe-top: env(safe-area-inset-top, 0px);
          --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* ============================================================ */
        /* BASE LAYOUT                                                  */
        /* ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
          width: 100%; height: 100%;
          overflow: hidden;
          font-family: -apple-system, "PingFang SC", sans-serif;
          background: var(--chat-bg);
          -webkit-touch-callout: none;
        }

        /* 背景壁纸层 */
        #bg-layer {
          position: fixed; inset: 0; z-index: 0;
          background-image: var(--chat-bg-image);
          background-size: cover; background-position: center;
          filter: blur(var(--chat-bg-blur));
          transform: scale(1.05);
        }
        #bg-overlay {
          position: fixed; inset: 0; z-index: 1;
          background: var(--chat-bg-overlay);
          pointer-events: none;
        }

        /* ============================================================ */
        /* HEADER                                                       */
        /* ============================================================ */
        #chat-header {
          position: fixed; top: 0; left: 0; right: 0;
          z-index: 100;
          height: calc(56px + var(--safe-top));
          padding-top: var(--safe-top);
          background: var(--header-bg);
          backdrop-filter: blur(var(--header-blur));
          -webkit-backdrop-filter: blur(var(--header-blur));
          border-bottom: 1px solid var(--header-border);
          display: flex; align-items: center;
          padding-left: 4px; padding-right: 12px;
          gap: 0;
        }
        #btn-back {
          width: 44px; height: 44px; flex-shrink: 0;
          display: flex; align-items: center; justify-content: center;
          background: none; border: none; cursor: pointer;
          color: var(--header-icon-color);
        }
        #btn-back svg { width: 24px; height: 24px; }
        #header-center {
          flex: 1; display: flex; flex-direction: column;
          align-items: center; justify-content: center;
          overflow: hidden;
        }
        #header-name {
          font-size: var(--header-title-size);
          font-weight: var(--header-title-weight);
          color: var(--header-title-color);
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        #header-status {
          margin-top: 2px;
          max-width: 180px;
          font-size: 10px;
          line-height: 13px;
          color: #8a8a8a;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
          transition: opacity .2s ease, transform .2s ease;
        }
        #header-status.status-changing { opacity: 0; transform: translateY(-2px); }
        #header-actions {
          display: flex; align-items: center; gap: 4px; flex-shrink: 0;
        }
        .header-action-btn {
          width: 40px; height: 40px;
          display: flex; align-items: center; justify-content: center;
          background: none; border: none; cursor: pointer;
          color: var(--header-icon-color);
          border-radius: 50%;
        }
        .header-action-btn svg { width: 22px; height: 22px; }
        .header-action-btn:active { opacity: 0.5; }

        /* ============================================================ */
        /* MESSAGE LIST                                                 */
        /* ============================================================ */
        #msg-list {
          position: fixed;
          top: calc(56px + var(--safe-top));
          bottom: calc(64px + var(--safe-bottom));
          left: 0; right: 0;
          overflow-y: auto; overflow-x: hidden;
          -webkit-overflow-scrolling: touch;
          z-index: 10;
          padding: 12px 12px 8px 12px;
          display: flex; flex-direction: column; gap: 2px;
        }
        #msg-list::-webkit-scrollbar { display: none; }

        /* ============================================================ */
        /* DATE DIVIDER                                                 */
        /* ============================================================ */
        .date-divider {
          display: flex; align-items: center; justify-content: center;
          margin: 10px 0 6px;
        }
        .date-divider span {
          font-size: 11px;
          color: var(--date-divider-color);
          background: var(--date-divider-bg);
          padding: 2px 10px; border-radius: 10px;
        }

        /* ============================================================ */
        /* MESSAGE ROW                                                  */
        /* ============================================================ */
        .msg-row {
          display: flex; align-items: flex-end; gap: 8px;
          margin-bottom: 4px;
          animation: msgIn 0.2s ease;
        }
        @keyframes msgIn {
          from { opacity: 0; transform: translateY(6px); }
          to   { opacity: 1; transform: translateY(0); }
        }
        .msg-row.me { flex-direction: row-reverse; }
        .msg-row.me .msg-avatar { display: none; }

        .msg-avatar {
          width: var(--avatar-size); height: var(--avatar-size);
          border-radius: var(--avatar-radius);
          object-fit: cover; flex-shrink: 0;
          background: #ccc;
        }

        .msg-col {
          display: flex; flex-direction: column;
          max-width: 72%;
        }
        .msg-row.me .msg-col { align-items: flex-end; }

        /* ============================================================ */
        /* BUBBLE                                                       */
        /* ============================================================ */
        .bubble {
          position: relative;
          font-size: var(--bubble-font-size);
          line-height: var(--bubble-line-height);
          padding: 9px 13px;
          word-break: break-word;
          white-space: pre-wrap;
          cursor: pointer;
          user-select: none;
          -webkit-user-select: none;
          -webkit-touch-callout: none;
          touch-action: manipulation;
        }
        .bubble.them {
          background: var(--bubble-them-bg);
          color: var(--bubble-them-color);
          border: var(--bubble-them-border);
          border-radius: var(--bubble-them-radius);
          box-shadow: var(--bubble-them-shadow);
        }
        .bubble.me {
          background: var(--bubble-me-bg);
          color: var(--bubble-me-color);
          border: var(--bubble-me-border);
          border-radius: var(--bubble-me-radius);
          box-shadow: var(--bubble-me-shadow);
        }
        .bubble:active { opacity: 0.75; }

        /* 时间戳 */
        .msg-time {
          font-size: 10px;
          color: var(--timestamp-color);
          margin-top: 3px;
          padding: 0 2px;
        }

        /* ============================================================ */
        /* INNER THOUGHTS (长按显示)                                    */
        /* ============================================================ */
        /* THOUGHTS CARD OVERLAY — 全屏遮罩，内联渲染用户模板          */
        /* ============================================================ */
        #thoughts-overlay {
  position: fixed;
  inset: 0;
  z-index: 400;
  background: rgba(0,0,0,0.4);

  display: none;
  align-items: center;
  justify-content: center;

  pointer-events: auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

#thoughts-overlay.visible {
  display: flex;
}

    #thoughts-card-inner{
    width:min(88vw, 420px);
    max-height:70vh;
    overflow-y:auto;

    border-radius:20px;

    position: relative;
    margin: 0;
}
#thoughts-floating-settings {
  position: fixed;
  top: calc(16px + var(--safe-top));
  right: 16px;
  width: 42px;
  height: 42px;
  border: none;
  border-radius: 50%;
  background: rgba(0,0,0,0.55);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  z-index: 9999;
  display: none;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

#thoughts-floating-settings:active {
  opacity: 0.7;
}
        /* ============================================================ */
        /* RECALLED / SYSTEM                                            */
        /* ============================================================ */
        .bubble.recalled {
          background: transparent !important;
          border: none !important; box-shadow: none !important;
          color: var(--recalled-color);
          font-size: 13px; font-style: italic;
          padding: 4px 0;
        }
        .system-msg {
          text-align: center; font-size: 12px;
          color: var(--system-msg-color);
          background: var(--system-msg-bg);
          padding: 3px 10px; border-radius: 10px;
          align-self: center; margin: 6px 0;
        }

        /* WeChat-inspired transfer / red-packet cards */
        .money-card {
          width: min(250px, 68vw);
          border-radius: 6px;
          overflow: hidden;
          color: #fff;
          box-shadow: 0 1px 4px rgba(0,0,0,.12);
          user-select: none;
          -webkit-user-select: none;
        }
        .money-card.transfer { background: #f39b3d; }
        .money-card.redpacket { background: #f35a45; }
        .money-card.opened { filter: saturate(.65); opacity: .8; }
        .money-main { display:flex; align-items:center; gap:12px; padding:15px 14px 13px; }
        .money-icon {
          width:42px; height:42px; border:2px solid rgba(255,255,255,.92);
          border-radius:50%; display:flex; align-items:center; justify-content:center;
          font-size:21px; flex-shrink:0;
        }
        .money-info { min-width:0; flex:1; }
        .money-amount { font-size:19px; font-weight:600; line-height:24px; }
        .money-note { font-size:13px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .money-state { font-size:11px; margin-top:3px; color:rgba(255,255,255,.78); }
        .money-footer { background:#fff; color:#9a9a9a; padding:5px 11px; font-size:10px; }

        /* ============================================================ */
        /* QUOTE                                                        */
        /* ============================================================ */
        .quote-block {
          margin-bottom: 8px;
          padding: 7px 8px;
          border-radius: 10px;
          background: rgba(0,0,0,0.16);
          border: 1px solid rgba(255,255,255,0.08);
          display: flex;
          align-items: center;
          gap: 8px;
          max-width: 100%;
          opacity: 0.92;
          white-space: normal;
        }
        .bubble.me .quote-block {
          background: rgba(255,255,255,0.18);
          border-color: rgba(255,255,255,0.12);
        }
        .quote-main {
          min-width: 0;
          flex: 1;
        }
        .quote-name {
          font-size: 11px;
          font-weight: 700;
          opacity: 0.75;
          margin-bottom: 3px;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .quote-text {
          font-size: 12px;
          line-height: 1.35;
          opacity: 0.78;
          display: -webkit-box;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;
          overflow: hidden;
          word-break: break-word;
        }
        .quote-thumb {
          width: 58px;
          height: 58px;
          border-radius: 8px;
          object-fit: cover;
          flex-shrink: 0;
          background: rgba(0,0,0,0.25);
        }

        /* ============================================================ */
        /* IMAGE                                                        */
        /* ============================================================ */
        .msg-img {
          max-width: 200px; max-height: 200px;
          border-radius: 10px; object-fit: cover;
          display: block; cursor: pointer;
        }
        .img-bubble {
          padding: 4px !important;
          border-radius: 12px !important;
        }

        /* ============================================================ */
        /* VOICE BUBBLE                                                 */
        /* ============================================================ */
        .voice-bubble {
          display: flex; align-items: center; gap: 8px;
          min-width: 80px;
        }
        .voice-duration { font-size: 13px; opacity: 0.8; }
        .voice-wave {
          display: flex; align-items: center; gap: 2px;
        }
        .voice-wave span {
          display: block; width: 3px; background: currentColor; border-radius: 2px;
          /* 默认静止，不播放时无动画 */
          animation: none;
        }
        /* 静止时固定高度 */
        .voice-wave span:nth-child(1) { height: 6px; }
        .voice-wave span:nth-child(2) { height: 12px; }
        .voice-wave span:nth-child(3) { height: 8px; }
        .voice-wave span:nth-child(4) { height: 4px; }
        .voice-wave span:nth-child(5) { height: 10px; }

        /* 播放中才有动画：给气泡加 .playing 类触发 */
        .bubble.playing .voice-wave span {
          animation: wave 0.8s ease infinite;
        }
        .bubble.playing .voice-wave span:nth-child(1) { animation-delay: 0s; }
        .bubble.playing .voice-wave span:nth-child(2) { animation-delay: 0.1s; }
        .bubble.playing .voice-wave span:nth-child(3) { animation-delay: 0.2s; }
        .bubble.playing .voice-wave span:nth-child(4) { animation-delay: 0.3s; }
        .bubble.playing .voice-wave span:nth-child(5) { animation-delay: 0.15s; }

        @keyframes wave {
          0%,100% { transform: scaleY(1); }
          50% { transform: scaleY(0.3); }
        }

        /* ============================================================ */
        /* MUSIC CARD                                                   */
        /* ============================================================ */
        .music-card {
          background: var(--music-card-bg);
          color: var(--music-card-color);
          border-radius: var(--music-card-radius);
          padding: 10px 12px;
          display: flex; align-items: center; gap: 10px;
          width: 220px; cursor: pointer;
          box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .music-cover {
          width: 44px; height: 44px; border-radius: 8px;
          object-fit: cover; flex-shrink: 0; background: #ddd;
        }
        .music-info { flex: 1; overflow: hidden; }
        .music-name {
          font-size: 14px; font-weight: 600;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .music-artist { font-size: 12px; opacity: 0.6; margin-top: 2px; }
        .music-play-icon { font-size: 22px; flex-shrink: 0; opacity: 0.7; }

        /* ============================================================ */
        /* VOICE TRANSLATE BUTTON                                       */
        /* ============================================================ */
        .voice-trans-wrap {
          margin-top: 4px;
        }
        .voice-trans-btn {
          font-size: 12px;
          color: var(--timestamp-color, rgba(100,100,100,0.6));
          text-decoration: underline;
          cursor: pointer;
          display: inline-block;
          padding: 2px 0;
        }
        .voice-trans-btn:active { opacity: 0.5; }
        .voice-trans-text {
          font-size: 13px;
          color: var(--bubble-them-color, #111111);
          margin-top: 6px;
          line-height: 1.5;
          white-space: pre-wrap;
          word-break: break-word;
          padding: 6px 8px;
          background: rgba(128,128,128,0.08);
          border-radius: 6px;
        }
        .translated-text {
          font-size: 12px; opacity: 0.65; margin-top: 6px;
          font-style: italic; display: none;
          border-top: 1px solid rgba(128,128,128,0.15);
          padding-top: 5px;
        }
        .translated-text.visible { display: block; }

        /* 有翻译的气泡右下角显示小「译」标记 */
        .bubble.has-trans::after {
          content: '译';
          font-size: 10px;
          opacity: 0.4;
          margin-left: 5px;
          vertical-align: middle;
          font-style: normal;
        }

        /* ============================================================ */
        /* TYPING INDICATOR                                             */
        /* ============================================================ */
        #typing-indicator {
          display: none;
          align-items: flex-end; gap: 8px;
          margin-bottom: 4px;
        }
        #typing-indicator .typing-avatar {
          width: var(--avatar-size); height: var(--avatar-size);
          border-radius: var(--avatar-radius); object-fit: cover; background: #ccc;
        }
        .typing-bubble {
          background: var(--bubble-them-bg);
          border-radius: var(--bubble-them-radius);
          box-shadow: var(--bubble-them-shadow);
          padding: 10px 14px;
          display: flex; gap: 4px; align-items: center;
        }
        .typing-dot {
          width: 7px; height: 7px; border-radius: 50%;
          background: currentColor; opacity: 0.4;
          animation: typingDot 1.2s ease infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingDot {
          0%,60%,100% { transform: translateY(0); opacity: 0.4; }
          30% { transform: translateY(-5px); opacity: 1; }
        }

        /* ============================================================ */
        /* CONTEXT MENU (长按菜单)                                      */
        /* ============================================================ */
        #context-menu {
          position: fixed; z-index: 300;
          background: rgba(40,40,40,0.95);
          backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
          border-radius: 14px; overflow: hidden;
          box-shadow: 0 8px 32px rgba(0,0,0,0.3);
          display: none; min-width: 140px;
        }
        #context-menu.visible { display: block; }
        .ctx-item {
          padding: 13px 18px; font-size: 15px; color: #fff;
          cursor: pointer; display: flex; align-items: center; gap: 10px;
          border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .ctx-item:last-child { border-bottom: none; }
        .ctx-item:active { background: rgba(255,255,255,0.1); }
        .ctx-item.danger { color: #ff4d4d; }

        /* ============================================================ */
        /* CHAT HISTORY — 仿微信/QQ的独立记录页                         */
        /* ============================================================ */
        #history-overlay {
          position: fixed; inset: 0; z-index: 600;
          display: none; flex-direction: column;
          background: #f5f5f5; color: #191919;
          padding-top: var(--safe-top);
        }
        #history-overlay.visible { display: flex; }
        .history-header {
          height: 56px; flex-shrink: 0; display: flex; align-items: center;
          background: #fff; border-bottom: 1px solid #e8e8e8; padding: 0 8px;
        }
        .history-icon-btn {
          width: 44px; height: 44px; border: 0; background: transparent;
          display: flex; align-items: center; justify-content: center;
          color: #191919; font-size: 16px; cursor: pointer;
        }
        .history-icon-btn svg { width: 23px; height: 23px; }
        .history-title { flex: 1; text-align: center; font-size: 17px; font-weight: 600; }
        .history-import { color: #576b95; width: auto; min-width: 52px; padding: 0 6px; }
        #history-calendar-view, #history-day-view { flex: 1; min-height: 0; overflow-y: auto; }
        #history-day-view { display: none; background: var(--chat-bg); position: relative; }
        .history-month-bar {
          height: 52px; display: flex; align-items: center; justify-content: space-between;
          background: #fff; padding: 0 18px; margin-top: 10px;
        }
        #history-month-label { font-size: 17px; font-weight: 600; }
        .month-arrow { border: 0; background: transparent; padding: 10px; font-size: 20px; color: #576b95; }
        .history-week, #history-calendar-grid {
          display: grid; grid-template-columns: repeat(7, 1fr); background: #fff;
          padding: 0 12px;
        }
        .history-week span { text-align: center; color: #999; font-size: 12px; padding: 8px 0; }
        .calendar-day {
          position: relative; height: 48px; border: 0; background: transparent;
          font-size: 15px; color: #222; border-radius: 8px;
        }
        .calendar-day.muted { color: #ccc; }
        .calendar-day.has-record { font-weight: 600; }
        .calendar-day.has-record::after {
          content: ''; position: absolute; width: 5px; height: 5px; border-radius: 50%;
          background: #07c160; bottom: 5px; left: calc(50% - 2.5px);
        }
        .calendar-day.today { color: #07c160; }
        .calendar-day:active { background: #e9e9e9; }
        .history-summary { margin: 12px 16px; color: #888; font-size: 13px; text-align: center; }
        #history-day-label { flex: 1; text-align: center; font-size: 16px; font-weight: 600; }
        #history-day-list { padding: 12px 12px 24px; display: flex; flex-direction: column; gap: 2px; }
        .history-empty { color: #999; text-align: center; padding: 72px 20px; font-size: 14px; }
        .history-loading { color: #999; text-align: center; padding: 28px; }

        /* ============================================================ */
        /* INPUT AREA                                                   */
        /* ============================================================ */
        #input-area {
          position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
          padding: 8px 10px calc(8px + var(--safe-bottom)) 10px;
          background: var(--input-area-bg);
          backdrop-filter: blur(var(--input-area-blur));
          -webkit-backdrop-filter: blur(var(--input-area-blur));
          border-top: 1px solid var(--input-area-border);
          display: flex; align-items: center; gap: 6px;
        }
        .input-btn {
          width: 36px; height: 36px; flex-shrink: 0;
          display: flex; align-items: center; justify-content: center;
          background: none; border: none; cursor: pointer;
          color: var(--icon-color); border-radius: 50%;
        }
        .input-btn svg { width: 24px; height: 24px; }
        .input-btn:active { opacity: 0.5; }

        #msg-input {
          flex: 1; min-height: 36px; max-height: 100px;
          background: var(--input-box-bg);
          color: var(--input-box-color);
          border: var(--input-box-border);
          border-radius: var(--input-box-radius);
          padding: 8px 12px; font-size: 15px;
          font-family: inherit; resize: none; outline: none;
          line-height: 1.4; overflow-y: auto;
        }
        #msg-input::placeholder { color: var(--input-box-placeholder); }

        #send-btn {
          width: 36px; height: 36px; flex-shrink: 0;
          background: var(--send-btn-bg); color: var(--send-btn-color);
          border: none; border-radius: 50%; cursor: pointer;
          display: flex; align-items: center; justify-content: center;
          transition: transform 0.15s, opacity 0.15s;
        }
        #send-btn svg { width: 18px; height: 18px; }
        #send-btn:active { transform: scale(0.9); opacity: 0.8; }

        /* ============================================================ */
        /* IMAGE VIEWER                                                 */
        /* ============================================================ */
        #img-viewer {
          position: fixed; inset: 0; z-index: 500;
          background: rgba(0,0,0,0.92);
          display: none; align-items: center; justify-content: center;
        }
        #img-viewer.visible { display: flex; }
        #img-viewer img {
          max-width: 95vw; max-height: 90vh;
          object-fit: contain; border-radius: 8px;
        }
        #img-viewer-close {
          position: absolute; top: calc(16px + var(--safe-top)); right: 16px;
          font-size: 28px; color: #fff; cursor: pointer; line-height: 1;
        }

        /* ============================================================ */
        /* USER CSS INJECTION PLACEHOLDER                              */
        /* The Android app injects user CSS here via JS               */
        /* ============================================================ */
    </style>

    <!-- USER CSS WILL BE INJECTED HERE BY THE APP -->
    <style id="user-custom-css"></style>
</head>
<body>

<!-- 背景层 -->
<div id="bg-layer"></div>
<div id="bg-overlay"></div>

<!-- 顶部栏 -->
<div id="chat-header">
    <button id="btn-back" onclick="Android.onBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
        </svg>
    </button>
    <div id="header-center">
        <div id="header-name">AI 名字</div>
        <div id="header-status">在线</div>
    </div>
    <div id="header-actions">
        <button class="header-action-btn" onclick="openHistory()" aria-label="聊天记录">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="5" width="18" height="16" rx="2"/><line x1="16" y1="3" x2="16" y2="7"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h3M8 17h6"/>
            </svg>
        </button>
        <button class="header-action-btn" onclick="Android.onCall()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.67A2 2 0 012 3h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 10.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
            </svg>
        </button>
        <button class="header-action-btn" onclick="Android.onSettings()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>
    </div>
</div>

<!-- 消息列表 -->
<div id="msg-list"></div>

<!-- 心声卡片遮罩：直接内联渲染，不用iframe避免跨域问题 -->
<div id="thoughts-overlay" onclick="closeThoughtsCard()">

    <button id="thoughts-floating-settings"
            onclick="event.stopPropagation();Android.onThoughtsCardSettings();">
        ⚙
    </button>

    <div id="thoughts-card-inner" onclick="event.stopPropagation()"></div>

</div>
<!-- 长按菜单 -->
<div id="context-menu">
    <div class="ctx-item" onclick="ctxQuote()" id="ctx-quote">💬 引用回复</div>
    <div class="ctx-item" onclick="ctxCopy()" id="ctx-copy">📋 复制</div>
    <div class="ctx-item" onclick="ctxRecall()" id="ctx-recall">👻 撤回</div>
    <div class="ctx-item danger" onclick="ctxDelete()">🗑️ 删除</div>
    <div class="ctx-item danger" onclick="ctxDeleteAndMemory()">🧠 删除+清除记忆</div>
</div>

<!-- 图片查看器 -->
<div id="img-viewer">
    <span id="img-viewer-close" onclick="closeImgViewer()">✕</span>
    <img id="img-viewer-img" src="">
</div>

<!-- 聊天记录：月历 + 单日记录 -->
<div id="history-overlay">
    <div class="history-header" id="history-main-header">
        <button class="history-icon-btn" onclick="closeHistory()" aria-label="返回">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="history-title">聊天记录</div>
        <button class="history-icon-btn history-import" onclick="Android.onExportHistory()">导出</button>
    </div>
    <div id="history-calendar-view">
        <div class="history-month-bar">
            <button class="month-arrow" onclick="changeHistoryMonth(-1)">‹</button>
            <span id="history-month-label"></span>
            <button class="month-arrow" onclick="changeHistoryMonth(1)">›</button>
        </div>
        <div class="history-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
        <div id="history-calendar-grid"></div>
        <div class="history-summary" id="history-summary"></div>
    </div>
    <div id="history-day-view">
        <div class="history-header">
            <button class="history-icon-btn" onclick="backToHistoryCalendar()" aria-label="返回月历">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <button class="history-icon-btn" onclick="moveHistoryDay(-1)">‹</button>
            <div id="history-day-label"></div>
            <button class="history-icon-btn" onclick="moveHistoryDay(1)">›</button>
            <div style="width:44px"></div>
        </div>
        <div id="history-day-list"></div>
    </div>
</div>

<!-- 底部输入栏 -->
<div id="input-area">
    <button class="input-btn" id="btn-add" onclick="Android.onAddImage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
    </button>

    <textarea
            id="msg-input"
            rows="1"
            placeholder="消息..."></textarea>

    <button class="input-btn" id="btn-sticker" onclick="Android.onSticker()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M8.5 10h.01M15.5 10h.01M9 14.5a3.5 3.5 0 006 0"/>
        </svg>
    </button>

    <button class="input-btn" id="btn-ai" onclick="Android.onAiTrigger()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 7l1.5 3.5L17 12l-3.5 1.5L12 17l-1.5-3.5L7 12l3.5-1.5z"/>
        </svg>
    </button>

    <button id="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
        </svg>
    </button>
</div>

<script>
    // ================================================================
    // STATE
    // ================================================================
    let aiAvatarSrc = '';
    let myAvatarSrc = '';
    let aiName = '';
    let ctxTargetMsg = null;
    let longPressTimer = null;
    let lastRenderedDate = '';
    let historyStats = {};
    let historyMonth = new Date();
    let historySelectedDate = '';

    // ================================================================
    // INIT — called by Android after page load
    // ================================================================
    function initChat(name, aiAvatar, myAvatar) {
      aiName = name;
      aiAvatarSrc = aiAvatar || '';
      myAvatarSrc = myAvatar || '';
      document.getElementById('header-name').textContent = name;
      const typingAvatar = document.querySelector('.typing-avatar');
      if (typingAvatar && aiAvatarSrc) typingAvatar.src = aiAvatarSrc;
    }

    function setCharacterStatus(status) {
      const el = document.getElementById('header-status');
      if (!el) return;
      el.classList.add('status-changing');
      setTimeout(function() {
        el.textContent = status || '在线';
        el.classList.remove('status-changing');
      }, 160);
    }

    // ================================================================
    // SET BACKGROUND — called by Android
    // ================================================================
    function setChatBackground(imageBase64) {
      const bg = document.getElementById('bg-layer');
      if (imageBase64 && imageBase64.length > 0) {
        bg.style.backgroundImage = 'url(' + imageBase64 + ')';
      } else {
        bg.style.backgroundImage = 'none';
      }
    }

    // ================================================================
    // APPLY USER CSS — called by Android when user imports CSS
    // ================================================================
    function applyUserCSS(cssText) {
      document.getElementById('user-custom-css').textContent = cssText;
    }

    // ================================================================
    // CLEAR MESSAGES
    // ================================================================
    function clearMessages() {
      document.getElementById('msg-list').innerHTML = '';
      lastRenderedDate = '';
    }

    // ================================================================
    // CHAT HISTORY CALENDAR
    // ================================================================
    function openHistory() {
      document.getElementById('history-overlay').classList.add('visible');
      backToHistoryCalendar();
      Android.onOpenHistory();
    }
    function closeHistory() { document.getElementById('history-overlay').classList.remove('visible'); }
    function backToHistoryCalendar() {
      document.getElementById('history-main-header').style.display = 'flex';
      document.getElementById('history-calendar-view').style.display = 'block';
      document.getElementById('history-day-view').style.display = 'none';
    }
    function setHistoryStats(statsJson) {
      const payload = JSON.parse(statsJson || '{}');
      historyStats = payload.days || {};
      if (payload.latest) {
        const p = payload.latest.split('-').map(Number);
        historyMonth = new Date(p[0], p[1] - 1, 1);
      } else { historyMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1); }
      document.getElementById('history-summary').textContent = payload.total ? ('共 ' + payload.total + ' 条聊天记录 · 有记录的日期已用绿点标记') : '暂无聊天记录';
      renderHistoryCalendar();
    }
    function changeHistoryMonth(delta) { historyMonth.setMonth(historyMonth.getMonth() + delta); renderHistoryCalendar(); }
    function formatDateKey(y, m, d) { return y + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0'); }
    function renderHistoryCalendar() {
      const y = historyMonth.getFullYear(), m = historyMonth.getMonth();
      document.getElementById('history-month-label').textContent = y + '年' + (m + 1) + '月';
      const grid = document.getElementById('history-calendar-grid'); grid.innerHTML = '';
      const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
      const today = new Date(), todayKey = formatDateKey(today.getFullYear(), today.getMonth()+1, today.getDate());
      for (let i=0; i<first; i++) { const x=document.createElement('span'); x.className='calendar-day'; grid.appendChild(x); }
      for (let d=1; d<=days; d++) {
        const key=formatDateKey(y,m+1,d), b=document.createElement('button');
        b.className='calendar-day' + (historyStats[key] ? ' has-record' : '') + (key===todayKey ? ' today' : '');
        b.textContent=d; b.onclick=function(){ openHistoryDay(key); }; grid.appendChild(b);
      }
    }
    function openHistoryDay(dateKey) {
      historySelectedDate = dateKey;
      document.getElementById('history-main-header').style.display = 'none';
      document.getElementById('history-calendar-view').style.display = 'none';
      document.getElementById('history-day-view').style.display = 'block';
      document.getElementById('history-day-label').textContent = dateKey;
      document.getElementById('history-day-list').innerHTML = '<div class="history-loading">正在加载…</div>';
      Android.onHistoryDateSelected(dateKey);
    }
    function moveHistoryDay(delta) {
      const p=historySelectedDate.split('-').map(Number), dt=new Date(p[0],p[1]-1,p[2]);
      dt.setDate(dt.getDate()+delta); openHistoryDay(formatDateKey(dt.getFullYear(),dt.getMonth()+1,dt.getDate()));
    }
    function showHistoryDay(dateKey, msgsJson) {
      historySelectedDate=dateKey; document.getElementById('history-day-label').textContent=dateKey;
      const list=document.getElementById('history-day-list'), msgs=JSON.parse(msgsJson || '[]'); list.innerHTML='';
      if (!msgs.length) { list.innerHTML='<div class="history-empty">这一天没有聊天记录</div>'; return; }
      msgs.forEach(function(d){
        if (d.isSystem) { const sm=document.createElement('div'); sm.className='system-msg'; sm.textContent=d.content; list.appendChild(sm); return; }
        const row=document.createElement('div'); row.className='msg-row'+(d.isFromMe?' me':'');
        if(!d.isFromMe){const av=document.createElement('img');av.className='msg-avatar';av.src=aiAvatarSrc||'';row.appendChild(av);}
        const col=document.createElement('div');col.className='msg-col';const bubble=document.createElement('div');bubble.className='bubble '+(d.isFromMe?'me':'them');
        if(d.isVoice){renderVoiceBubble(bubble,d.voiceDuration);}else{const s=document.createElement('span');s.textContent=d.content; bubble.appendChild(s);}
        col.appendChild(bubble);const tm=document.createElement('div');tm.className='msg-time';tm.textContent=d.timeStr||'';col.appendChild(tm);row.appendChild(col);list.appendChild(row);
      });
      list.scrollTop=0;
    }

    // ================================================================
    // ADD MESSAGE — called by Android for each message
    // msgData JSON fields:
    //   id, content, isFromMe, timestamp, timeStr, dateStr,
    //   isSystem, isVoice, voiceDuration,
    //   imageUri (base64 data URI or empty),
    //   musicCardJson, isRecalled,
    //   innerThoughts, translatedText,
    //   quoteWho, quoteText, quoteImage
    // ================================================================
    function addMessage(msgDataJson) {
      const d = JSON.parse(msgDataJson);
      const list = document.getElementById('msg-list');

      // Date divider
      if (d.dateStr && d.dateStr !== lastRenderedDate) {
        lastRenderedDate = d.dateStr;
        const div = document.createElement('div');
        div.className = 'date-divider';
        div.innerHTML = '<span>' + escHtml(d.dateStr) + '</span>';
        list.appendChild(div);
      }

      // System message
      if (d.isSystem) {
        const sm = document.createElement('div');
        sm.className = 'system-msg';
        sm.textContent = d.content;
        list.appendChild(sm);
        scrollToBottom();
        return;
      }

      // Message row
      const row = document.createElement('div');
      row.className = 'msg-row' + (d.isFromMe ? ' me' : '');
      row.dataset.id = d.id || '';
      row.dataset.content = d.content || '';
      row.dataset.inner = d.innerThoughts || '';
      row.dataset.fromMe = d.isFromMe ? '1' : '0';
      row.dataset.isRecalled = d.isRecalled ? '1' : '0';
      row.dataset.imageUri = d.imageUri || '';
      row.dataset.quoteImage = d.quoteImage || '';

      // Avatar (only for AI)
      if (!d.isFromMe) {
        const av = document.createElement('img');
        av.className = 'msg-avatar';
        av.src = aiAvatarSrc || '';
        av.onerror = function() { this.style.background = '#ccc'; this.src = ''; };
        bindAvatarEvents(av, d);
        row.appendChild(av);
      }

      // Column
      const col = document.createElement('div');
      col.className = 'msg-col';

      // Build bubble
      const bubble = document.createElement('div');
      bubble.className = 'bubble ' + (d.isFromMe ? 'me' : 'them');

      if (d.isRecalled) {
        bubble.className += ' recalled';
        bubble.textContent = d.content;
      } else if (d.musicCardJson) {
        renderMusicCard(bubble, d.musicCardJson);
      } else if (d.moneyCardJson) {
        renderMoneyCard(bubble, d.moneyCardType, d.moneyCardJson, d.id || '');
      } else if (d.imageUri) {
        renderImageBubble(bubble, d.imageUri, d.content);
      } else if (d.isVoice) {
        renderVoiceBubble(bubble, d.voiceDuration);
        appendVoiceTranscription(col, d);
      } else {
        // Text bubble
        renderQuoteBlock(bubble, d);
        const textNode = document.createElement('span');
        textNode.textContent = d.content;
        bubble.appendChild(textNode);
        // Translated — 默认隐藏，点击气泡展开/收起
        if (d.translatedText) {
          bubble.classList.add('has-trans');
          const tr = document.createElement('div');
          tr.className = 'translated-text';
          tr.textContent = d.translatedText;
          bubble.appendChild(tr);
        }
      }

      // Long-press / touch events
      bindBubbleEvents(bubble, row, d);

      col.appendChild(bubble);

      // Timestamp
      if (d.timeStr) {
        const ts = document.createElement('div');
        ts.className = 'msg-time';
        ts.textContent = d.timeStr;
        col.appendChild(ts);
      }

      row.appendChild(col);
      list.appendChild(row);
      scrollToBottom();
    }

    function renderQuoteBlock(bubble, d) {
      if (!(d.quoteWho || d.quoteText || d.quoteImage)) return;
      const qb = document.createElement('div');
      qb.className = 'quote-block';

      const main = document.createElement('div');
      main.className = 'quote-main';

      const name = document.createElement('div');
      name.className = 'quote-name';
      name.textContent = d.quoteWho || '引用';

      const text = document.createElement('div');
      text.className = 'quote-text';
      text.textContent = d.quoteText || (d.quoteImage ? '【图片】' : '');

      main.appendChild(name);
      main.appendChild(text);
      qb.appendChild(main);

      if (d.quoteImage) {
        const img = document.createElement('img');
        img.className = 'quote-thumb';
        img.src = d.quoteImage;
        img.onerror = function() { this.style.display = 'none'; };
        img.onclick = function(e) { e.stopPropagation(); openImgViewer(d.quoteImage); };
        qb.appendChild(img);
      }

      bubble.appendChild(qb);
    }

    function renderMoneyCard(bubble, type, cardJson, msgId) {
      bubble.style.padding = '0';
      bubble.style.background = 'transparent';
      bubble.style.boxShadow = 'none';
      bubble.style.border = 'none';
      let card = {};
      try { card = JSON.parse(cardJson || '{}'); } catch(e) {}
      const kind = type === 'redpacket' ? 'redpacket' : 'transfer';
      const opened = !!card.opened;
      const box = document.createElement('div');
      box.className = 'money-card ' + kind + (opened ? ' opened' : '');
      const amount = Number(card.amount || 0).toFixed(2);
      const note = card.note || (kind === 'redpacket' ? '恭喜发财，大吉大利' : '转账给你');
      box.innerHTML = '<div class="money-main">' +
        '<div class="money-icon">' + (kind === 'redpacket' ? '🧧' : '¥') + '</div>' +
        '<div class="money-info"><div class="money-amount">¥' + escHtml(amount) + '</div>' +
        '<div class="money-note">' + escHtml(note) + '</div>' +
        '<div class="money-state">' + (opened ? (kind === 'redpacket' ? '红包已领取' : '已收款') : '点击' + (kind === 'redpacket' ? '领取红包' : '确认收款')) + '</div></div></div>' +
        '<div class="money-footer">' + (kind === 'redpacket' ? '微信红包' : '微信转账') + '</div>';
      if (!opened) box.onclick = function(e) {
        e.stopPropagation();
        Android.onMoneyCardClick(msgId, kind);
      };
      bubble.appendChild(box);
    }

    function bindAvatarEvents(avatar, d) {
      let lastTap = 0;
      let singleTimer = null;
      let longTimer = null;
      avatar.style.cursor = 'pointer';
      avatar.addEventListener('click', function(e) {
        e.stopPropagation();
        const now = Date.now();
        if (now - lastTap < 330) {
          clearTimeout(singleTimer);
          lastTap = 0;
          Android.onPokeAi();
          return;
        }
        lastTap = now;
        singleTimer = setTimeout(function() {
          if (d.innerThoughts) showThoughtsCard(d.innerThoughts, avatar);
        }, 340);
      });
      avatar.addEventListener('touchstart', function() {
        clearTimeout(longTimer);
        longTimer = setTimeout(function() { Android.onPokeSettings(); }, 650);
      }, {passive:true});
      avatar.addEventListener('touchend', function() { clearTimeout(longTimer); }, {passive:true});
      avatar.addEventListener('touchmove', function() { clearTimeout(longTimer); }, {passive:true});
      avatar.addEventListener('contextmenu', function(e) {
        e.preventDefault(); e.stopPropagation(); Android.onPokeSettings();
      });
    }

    function renderMusicCard(bubble, cardJson) {
      bubble.style.padding = '0';
      bubble.style.background = 'transparent';
      bubble.style.boxShadow = 'none';
      bubble.style.border = 'none';
      let card;
      try { card = JSON.parse(cardJson); } catch(e) { bubble.textContent = '🎵 音乐'; return; }
      const mc = document.createElement('div');
      mc.className = 'music-card';
      mc.innerHTML =
        '<img class="music-cover" src="' + escHtml(card.coverUrl || '') + '" onerror="this.style.background=\'#ddd\'">' +
        '<div class="music-info"><div class="music-name">' + escHtml(card.songName || '') + '</div>' +
        '<div class="music-artist">' + escHtml(card.artist || '') + '</div></div>' +
        '<span class="music-play-icon">▶</span>';
      mc.onclick = function() { Android.onMusicCardClick(card.songId || ''); };
      bubble.appendChild(mc);
    }

    function renderImageBubble(bubble, imageUri, alt) {
      bubble.className += ' img-bubble';
      const img = document.createElement('img');
      img.className = 'msg-img';
      img.src = imageUri;
      img.alt = alt || '';
      img.onclick = function(e) { e.stopPropagation(); openImgViewer(imageUri); };
      bubble.appendChild(img);
    }

    function renderVoiceBubble(bubble, duration) {
      bubble.className += ' voice-bubble-wrap';
      bubble.innerHTML =
        '<div class="voice-bubble">' +
        '<div class="voice-wave"><span></span><span></span><span></span><span></span><span></span></div>' +
        '<span class="voice-duration">' + (duration || 0) + '"</span>' +
        '</div>';
    }

    function appendVoiceTranscription(col, d) {
      const voiceTransWrap = document.createElement('div');
      voiceTransWrap.className = 'voice-trans-wrap';
      voiceTransWrap.dataset.msgId = d.id || '';
      voiceTransWrap.style.order = '2';

      const voiceTransBtn = document.createElement('span');
      voiceTransBtn.className = 'voice-trans-btn';
      voiceTransWrap.appendChild(voiceTransBtn);

      let voiceTransText = null;
      if (d.translatedText) {
        voiceTransBtn.textContent = '查看转写文字';
        voiceTransText = document.createElement('div');
        voiceTransText.className = 'voice-trans-text';
        voiceTransText.textContent = d.translatedText;
        voiceTransText.style.display = 'none';
        voiceTransWrap.appendChild(voiceTransText);
        voiceTransBtn.onclick = function() {
          const isVisible = voiceTransText.style.display !== 'none';
          voiceTransText.style.display = isVisible ? 'none' : 'block';
          voiceTransBtn.textContent = isVisible ? '查看转写文字' : '收起';
        };
      } else {
        // 语音的"转写"就是消息原文，直接本地展示，不依赖 API；
        // 外语语音第一次展开时后台再请求中文翻译，返回后由 onVoiceTranslateDone 替换
        voiceTransBtn.textContent = '查看转写文字';
        voiceTransText = document.createElement('div');
        voiceTransText.className = 'voice-trans-text';
        voiceTransText.textContent = d.content || '';
        voiceTransText.style.display = 'none';
        voiceTransWrap.appendChild(voiceTransText);
        voiceTransWrap.dataset.translateState = 'idle';
        voiceTransBtn.onclick = function() {
          const isVisible = voiceTransText.style.display !== 'none';
          voiceTransText.style.display = isVisible ? 'none' : 'block';
          voiceTransBtn.textContent = isVisible ? '查看转写文字' : '收起';
          if (!isVisible && voiceTransWrap.dataset.translateState === 'idle' && !/[一-鿿]/.test(d.content || '')) {
            voiceTransWrap.dataset.translateState = 'loading';
            try { Android.onTranslateVoice(d.content, d.id || ''); } catch (e) {}
          }
        };
      }
      col.appendChild(voiceTransWrap);
    }

    // ================================================================
    // SHOW / HIDE TYPING INDICATOR
    // ================================================================
    function showTyping() {
      const t = document.getElementById('typing-indicator');
      if (t) { t.style.display = 'flex'; scrollToBottom(); }
      // 顶栏名字变成"正在输入…"
      const nameEl = document.getElementById('header-name');
      if (nameEl) {
        nameEl.dataset.origName = nameEl.dataset.origName || nameEl.textContent;
        nameEl.textContent = '正在输入…';
        nameEl.style.color = 'var(--header-title-color, #111)';
        nameEl.style.opacity = '0.6';
        nameEl.style.fontStyle = 'italic';
      }
    }
    function hideTyping() {
      const t = document.getElementById('typing-indicator');
      if (t) t.style.display = 'none';
      // 恢复顶栏名字
      const nameEl = document.getElementById('header-name');
      if (nameEl && nameEl.dataset.origName) {
        nameEl.textContent = nameEl.dataset.origName;
        nameEl.style.opacity = '1';
        nameEl.style.fontStyle = 'normal';
      }
    }

    // Typing indicator element (appended to msg-list)
    (function() {
      const list = document.getElementById('msg-list');
      const t = document.createElement('div');
      t.id = 'typing-indicator';
      t.innerHTML =
        '<img class="typing-avatar" src="">' +
        '<div class="typing-bubble">' +
        '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>' +
        '</div>';
      list.appendChild(t);
    })();

    // ================================================================
    // UPDATE AI AVATAR (called by Android)
    // ================================================================
    function updateAiAvatar(src) {
      aiAvatarSrc = src;
      document.querySelectorAll('.msg-avatar, .typing-avatar').forEach(el => { el.src = src; });
    }

    // ================================================================
    // UPDATE SPECIFIC MESSAGE (recalled, translated, etc.)
    // ================================================================
    function updateMessage(msgId, newContentJson) {
      const d = JSON.parse(newContentJson);
      const row = document.querySelector('.msg-row[data-id="' + msgId + '"]');
      if (!row) return;
      const bubble = row.querySelector('.bubble');
      if (!bubble) return;
      if (d.isRecalled) {

    row.dataset.isRecalled = '1';
    row.dataset.recalledText =
        d.recalledText || '';

    bubble.className =
        'bubble ' +
        (d.isFromMe ? 'me' : 'them') +
        ' recalled';

    bubble.innerHTML = '';
    bubble.textContent = d.content;
}
      if (d.translatedText !== undefined) {
        let tr = bubble.querySelector('.translated-text');
        if (!tr) {
          tr = document.createElement('div');
          tr.className = 'translated-text';
          bubble.appendChild(tr);
          bubble.classList.add('has-trans');
        }
        tr.textContent = d.translatedText;
      }
    }

    // ================================================================
    // GET INPUT TEXT (called by Android)
    // ================================================================
    function getInputText() {
      return document.getElementById('msg-input').value.trim();
    }
    function clearInput() {
      const el = document.getElementById('msg-input');
      el.value = '';
      el.style.height = 'auto';
    }
    function setInputHint(hint) {
    const el = document.getElementById('msg-input');

    if (el.placeholder === hint) {
        return;
    }

    el.placeholder = hint;
}

    // ================================================================
    // SEND MESSAGE
    // ================================================================
    function sendMessage() {
      const text = getInputText();
      if (!text) return;
      Android.onSend(text);
      clearInput();
    }

    // ================================================================
    // BUBBLE LONG-PRESS / CONTEXT MENU
    // ================================================================
  function bindBubbleEvents(bubble, row, d) {
      let pressTimer = null;
      let didLongPress = false;
      let startX = 0;
      let startY = 0;

      bubble.addEventListener('touchstart', function(e) {
        didLongPress = false;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        pressTimer = setTimeout(function() {
          didLongPress = true;
          e.preventDefault();
          showContextMenu(e.touches[0], row, d);
        }, 600);
      }, { passive: false });

      bubble.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        showContextMenu(e, row, d);
      });

      bubble.addEventListener('touchmove', function(e) {
        const dx = Math.abs(e.touches[0].clientX - startX);
        const dy = Math.abs(e.touches[0].clientY - startY);
        if (dx > 8 || dy > 8) { clearTimeout(pressTimer); }
      }, { passive: true });

      bubble.addEventListener('touchend', function() {
        clearTimeout(pressTimer);
      });

      bubble.addEventListener('touchcancel', function() {
        clearTimeout(pressTimer);
        didLongPress = false;
      });

      bubble.addEventListener('click', function(e) {
        if (didLongPress) return;
        // 撤回消息点击 → 偷看原内容
        const isActuallyRecalled = d.isRecalled || row.dataset.isRecalled === '1' || bubble.classList.contains('recalled');
        if (isActuallyRecalled) { Android.onPeekRecalled(row.dataset.id || d.id || ''); return; }
        // 语音气泡点击 → 播放，并切换音浪动画
        if (d.isVoice) {
  const currentPlaying = document.querySelector('.bubble.playing');
  if (currentPlaying && currentPlaying === bubble) {
    // 当前这条正在播放 → 暂停
    bubble.classList.remove('playing');
    if (typeof Android !== 'undefined') Android.onStopVoice();
  } else {
    // 停掉其他正在播放的
    if (currentPlaying) {
      currentPlaying.classList.remove('playing');
      if (typeof Android !== 'undefined') Android.onStopVoice();
    }
    // 播放这条
    bubble.classList.add('playing');
    if (typeof Android !== 'undefined') Android.onPlayVoice(d.content, d.id || '');
    const dur = (d.voiceDuration || 5) * 1000 + 1000;
    bubble._voiceTimer = setTimeout(() => {
      bubble.classList.remove('playing');
    }, dur);
  }
  return;
}
        // 有翻译 → 切换显示
        const tr = bubble.querySelector('.translated-text');
        if (tr) tr.classList.toggle('visible');
      });

    }

    function showContextMenu(touch, row, d) {
      ctxTargetMsg = { row, d };
      const menu = document.getElementById('context-menu');
      const isRecalled = d.isRecalled;
      const isFromMe = d.isFromMe;
      document.getElementById('ctx-quote').style.display = isRecalled ? 'none' : 'flex';
      document.getElementById('ctx-copy').style.display = isRecalled ? 'none' : 'flex';
      document.getElementById('ctx-recall').style.display = (isFromMe && !isRecalled) ? 'flex' : 'none';
      menu.classList.add('visible');
      const x = Math.min(touch.clientX, window.innerWidth - 180);
      const y = Math.min(touch.clientY, window.innerHeight - 220);
      menu.style.left = x + 'px';
      menu.style.top = y + 'px';
    }

    function hideContextMenu() {
      document.getElementById('context-menu').classList.remove('visible');
      ctxTargetMsg = null;
    }

    function ctxQuote() {
      if (!ctxTargetMsg) return;
      Android.onQuote(JSON.stringify({
        content: ctxTargetMsg.d.content,
        isFromMe: ctxTargetMsg.d.isFromMe,
        imageUri: ctxTargetMsg.d.imageUri || ctxTargetMsg.row.dataset.imageUri || ''
      }));
      hideContextMenu();
    }
    function ctxCopy() {
      if (!ctxTargetMsg) return;
      Android.onCopy(ctxTargetMsg.d.content);
      hideContextMenu();
    }
    function ctxRecall() {
      if (!ctxTargetMsg) return;
      Android.onRecallMsg(ctxTargetMsg.d.id || '');
      hideContextMenu();
    }
    function ctxDelete() {
      if (!ctxTargetMsg) return;
      Android.onDeleteMsg(ctxTargetMsg.d.id || '');
      ctxTargetMsg.row.remove();
      hideContextMenu();
    }
    function ctxDeleteAndMemory() {
      if (!ctxTargetMsg) return;
      Android.onDeleteMsgAndMemory(ctxTargetMsg.d.id || '', ctxTargetMsg.d.content || '');
      ctxTargetMsg.row.remove();
      hideContextMenu();
    }

 document.addEventListener('touchstart', function(e) {
      const menu = document.getElementById('context-menu');
      if (menu.classList.contains('visible') && !menu.contains(e.target)) {
        hideContextMenu();
      }
    }, { passive: true });

    document.addEventListener('click', function(e) {
      const menu = document.getElementById('context-menu');
      if (menu.classList.contains('visible') && !menu.contains(e.target)) hideContextMenu();
    });

    // ================================================================
    // VOICE TRANSLATE CALLBACK — called by Android when done
    // ================================================================
    function onVoiceTranslateDone(msgId, translatedText) {
      const wrap = document.querySelector('.voice-trans-wrap[data-msg-id="' + msgId + '"]');
      if (!wrap) return;
      const btn = wrap.querySelector('.voice-trans-btn');
      if (!btn) return;

      // 创建转写文字区域
      let textEl = wrap.querySelector('.voice-trans-text');
      if (!textEl) {
        textEl = document.createElement('div');
        textEl.className = 'voice-trans-text';
        wrap.appendChild(textEl);
      }
      textEl.textContent = translatedText;
      wrap.dataset.translateState = 'done';
      textEl.style.display = 'block';
      btn.textContent = '收起';
      btn.style.pointerEvents = 'auto';
      btn.onclick = function() {
        const isVisible = textEl.style.display !== 'none';
        textEl.style.display = isVisible ? 'none' : 'block';
        btn.textContent = isVisible ? '查看转写文字' : '收起';
      };
    }

    function onVoiceTranslateFail(msgId) {
      const wrap = document.querySelector('.voice-trans-wrap[data-msg-id="' + msgId + '"]');
      if (!wrap) return;
      const btn = wrap.querySelector('.voice-trans-btn');
      wrap.dataset.translateState = 'idle';
      if (btn) { btn.textContent = '转写失败，点击重试'; btn.style.pointerEvents = 'auto'; }
    }
    function showThoughtsCard(thoughts, avatarEl) {
      Android.onShowThoughtsCard(thoughts);
    }

    // 由 Android 调用，传入渲染好的HTML
    function renderThoughtsCard(renderedHtml) {
      const overlay = document.getElementById('thoughts-overlay');
      const inner = document.getElementById('thoughts-card-inner');

      // 提取 <body> 内容，或直接用整段HTML
      let content = renderedHtml;
      const bodyMatch = renderedHtml.match(/<body[^>]*>([\s\S]*)<\/body>/i);
      if (bodyMatch) content = bodyMatch[1];

      // 提取 <style> 注入进主页面
      const styleMatches = renderedHtml.matchAll(/<style[^>]*>([\s\S]*?)<\/style>/gi);
      let injectedStyleId = 'thoughts-card-style';
      let existingStyle = document.getElementById(injectedStyleId);
      if (existingStyle) existingStyle.remove();
      const styleEl = document.createElement('style');
      styleEl.id = injectedStyleId;
      for (const m of styleMatches) { styleEl.textContent += m[1]; }
      styleEl.textContent += '\n* { text-shadow: none !important; }';
      document.head.appendChild(styleEl);

      // 注入内容
      inner.innerHTML = content;

      // 把模板里的 onClose / onSettings 绑定到主页面函数
      // 直接在 inner 的 window 作用域里定义
      const scriptEl = document.createElement('script');
      scriptEl.textContent = `
        function onClose()    { window.__thoughtsClose(); }
        function onSettings() { window.__thoughtsSettings(); }
      `;
      inner.appendChild(scriptEl);

      overlay.classList.add('visible');

const floatingBtn =
    document.getElementById('thoughts-floating-settings');

if (floatingBtn) {

    const hasSettings =
        content.includes('onSettings(') ||
        content.includes('card:settings');

    if (hasSettings) {
        floatingBtn.style.display = 'none';
    } else {
        floatingBtn.style.display = 'block';
    }
}

overlay.scrollTop = 0;
    }

    // 全局绑定，供注入的script调用
    window.__thoughtsClose = function() { closeThoughtsCard(); };
    window.__thoughtsSettings = function() {
      if (typeof Android !== 'undefined') Android.onThoughtsCardSettings();
    };

    function closeThoughtsCard() {
      const overlay = document.getElementById('thoughts-overlay');
      const inner = document.getElementById('thoughts-card-inner');
      overlay.classList.remove('visible');

const floatingBtn =
    document.getElementById('thoughts-floating-settings');

if (floatingBtn)
    floatingBtn.style.display = 'none';

inner.innerHTML = '';
      // 清理注入的样式
      const s = document.getElementById('thoughts-card-style');
      if (s) s.remove();
    }

    // 监听 postMessage（兼容旧模板）
    window.addEventListener('message', function(e) {
      if (e.data === 'card:close') closeThoughtsCard();
      else if (e.data === 'card:settings') {
        if (typeof Android !== 'undefined') Android.onThoughtsCardSettings();
      }
    });

    // ================================================================
    // IMAGE VIEWER
    // ================================================================
    function openImgViewer(src) {
      document.getElementById('img-viewer-img').src = src;
      document.getElementById('img-viewer').classList.add('visible');
    }
    function closeImgViewer() {
      document.getElementById('img-viewer').classList.remove('visible');
    }

    // ================================================================
    // AUTO-RESIZE TEXTAREA
    // ================================================================
    document.getElementById('msg-input').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    });
    document.getElementById('msg-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    // ================================================================
    // PREPEND MESSAGES — 批量插入历史消息到列表顶部
    // ================================================================
    function prependMessages(msgsJson) {
      const list = document.getElementById('msg-list');
      const msgs = JSON.parse(msgsJson);
      // 记录当前滚动位置，插入后保持不动
      const oldHeight = list.scrollHeight;
      const oldScroll = list.scrollTop;

      const frag = document.createDocumentFragment();
      let lastDate = '';

      // 找到当前最早的日期分隔线
      const firstDivider = list.querySelector('.date-divider');
      if (firstDivider) lastDate = firstDivider.querySelector('span')?.textContent || '';

      msgs.forEach(function(d) {
        if (d.dateStr && d.dateStr !== lastDate) {
          lastDate = d.dateStr;
          const div = document.createElement('div');
          div.className = 'date-divider';
          div.innerHTML = '<span>' + escHtml(d.dateStr) + '</span>';
          frag.appendChild(div);
        }
        if (d.isSystem) {
          const sm = document.createElement('div');
          sm.className = 'system-msg';
          sm.textContent = d.content;
          frag.appendChild(sm);
          return;
        }
        const row = document.createElement('div');
        row.className = 'msg-row' + (d.isFromMe ? ' me' : '');
        row.dataset.id = d.id || '';
        row.dataset.content = d.content || '';
        row.dataset.inner = d.innerThoughts || '';
        row.dataset.fromMe = d.isFromMe ? '1' : '0';
        row.dataset.isRecalled = d.isRecalled ? '1' : '0';
        row.dataset.imageUri = d.imageUri || '';
        row.dataset.quoteImage = d.quoteImage || '';
        if (!d.isFromMe) {
          const av = document.createElement('img');
          av.className = 'msg-avatar';
          av.src = aiAvatarSrc || '';
          bindAvatarEvents(av, d);
          row.appendChild(av);
        }
        const col = document.createElement('div');
        col.className = 'msg-col';
        const bubble = document.createElement('div');
        bubble.className = 'bubble ' + (d.isFromMe ? 'me' : 'them');
        if (d.isRecalled) {
          bubble.className += ' recalled';
          bubble.textContent = d.content;
        } else if (d.musicCardJson) {
          renderMusicCard(bubble, d.musicCardJson);
        } else if (d.moneyCardJson) {
          renderMoneyCard(bubble, d.moneyCardType, d.moneyCardJson, d.id || '');
        } else if (d.isVoice) {
          renderVoiceBubble(bubble, d.voiceDuration);
          appendVoiceTranscription(col, d);
        } else {
          renderQuoteBlock(bubble, d);
          const textNode = document.createElement('span');
          textNode.textContent = d.content;
          bubble.appendChild(textNode);
          if (d.translatedText) {
            bubble.classList.add('has-trans');
            const tr = document.createElement('div');
            tr.className = 'translated-text';
            tr.textContent = d.translatedText;
            bubble.appendChild(tr);
          }
        }
        bindBubbleEvents(bubble, row, d);
        col.appendChild(bubble);
        if (d.timeStr) {
          const ts = document.createElement('div');
          ts.className = 'msg-time';
          ts.textContent = d.timeStr;
          col.appendChild(ts);
        }
        row.appendChild(col);
        frag.appendChild(row);
      });

      // 插到列表最前面（typing indicator之前）
      const typing = document.getElementById('typing-indicator');
      list.insertBefore(frag, list.firstChild);

      // 恢复滚动位置，不让用户感知到插入
      list.scrollTop = oldScroll + (list.scrollHeight - oldHeight);
    }

    // ================================================================
    // REMOVE MESSAGE BY ID — called by Android to remove placeholder
    // ================================================================
    function removeMessageById(msgId) {
      const row = document.querySelector('.msg-row[data-id="' + msgId + '"]');
      if (row) row.remove();
    }

    function updateMoneyCard(msgId, type, cardJson) {
      const row = document.querySelector('.msg-row[data-id="' + msgId + '"]');
      if (!row) return;
      const bubble = row.querySelector('.bubble');
      if (!bubble) return;
      bubble.innerHTML = '';
      renderMoneyCard(bubble, type, cardJson, msgId);
    }

    // ================================================================
    // SCROLL
    // ================================================================
    function scrollToBottom() {
      const list = document.getElementById('msg-list');
      list.scrollTop = list.scrollHeight;
    }

    // ================================================================
    // KEYBOARD ADAPT — 键盘弹出时调整布局，输入框始终可见
    // ================================================================
    (function() {
      function onViewportResize() {
        const vv = window.visualViewport;
        if (!vv) return;
        const keyboardHeight = window.innerHeight - vv.height - vv.offsetTop;
        const inputArea = document.getElementById('input-area');
        const msgList = document.getElementById('msg-list');
        if (!inputArea || !msgList) return;

        if (keyboardHeight > 50) {
          // 键盘弹出：输入栏上移
          inputArea.style.bottom = keyboardHeight + 'px';
          inputArea.style.transition = 'bottom 0.15s ease';
          msgList.style.bottom = (keyboardHeight + inputArea.offsetHeight) + 'px';
          msgList.style.transition = 'bottom 0.15s ease';
          // 滚到底部保证最新消息可见
          setTimeout(() => { msgList.scrollTop = msgList.scrollHeight; }, 150);
        } else {
          // 键盘收起：恢复
          inputArea.style.bottom = '0';
          msgList.style.bottom = 'calc(64px + var(--safe-bottom))';
        }
      }

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', onViewportResize);
        window.visualViewport.addEventListener('scroll', onViewportResize);
      }
    })();

    // ================================================================
    // UTILS
    // ================================================================
    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
</script>
